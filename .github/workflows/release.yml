name: Prepare release Flatpaks
run-name: Prepare Flatpaks for ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build into a draft release
        required: true
        default: v0.1.2
        type: string
      create_draft:
        description: Create a new draft release (disable when rebuilding an existing release)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require trusted default branch tooling
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    uses: ./.github/workflows/native.yml
    with:
      source_ref: ${{ needs.verify.outputs.commit }}
      release_tag: ${{ inputs.tag }}
      release: true
  attest:
    name: Attest ${{ matrix.arch }} bundle
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: skyloom-release-${{ matrix.arch }}-x11
          path: dist
      - name: Verify bundle checksum
        working-directory: dist
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: sha256sum --check "SHA256SUMS-$BUILD_ARCH"
      - name: Attest validated release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.flatpak
            dist/BUILD_INFO-*.txt
  draft:
    name: Prepare reviewed release assets
    needs: [build, attest]
    if: ${{ inputs.create_draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: skyloom-release-*-x11
          path: dist
          merge-multiple: true
      - name: Verify both architectures and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          test -s "com.nedrichards.Skyloom-$RELEASE_TAG-x86_64.flatpak"
          test -s "com.nedrichards.Skyloom-$RELEASE_TAG-aarch64.flatpak"
          sha256sum --check SHA256SUMS-x86_64
          sha256sum --check SHA256SUMS-aarch64
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 > SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'An existing release is never overwritten. Download the build artifacts for review.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.flatpak ./SHA256SUMS ./BUILD_INFO-*.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Skyloom $RELEASE_TAG"
          echo "Draft prepared for $RELEASE_TAG. Publication requires maintainer review." >> "$GITHUB_STEP_SUMMARY"
